apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-dropout
spec:
  replicas: 2
  selector:
    matchLabels:
      app: student-dropout
  template:
    metadata:
      labels:
        app: student-dropout
    spec:
      containers:
      - name: student-dropout
        image: student-dropout:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9696
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        readinessProbe:
          httpGet:
            path: /health
            port: 9696
          initialDelaySeconds: 5
          periodSeconds: 5